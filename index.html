<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gruppenchat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0A0F1A;
      --blue: #0A3D62;
      --light-blue: #4FC3F7;
      --text-light: #EAEAEA;
      --bubble-blue: #1C2733;
      --bubble-sent: #4FC3F7;
      --bubble-received: #2E3B47;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: var(--bg-dark);
      color: var(--text-light);
    }

    /* Header */
    .header {
      background: rgba(10, 61, 98, .9);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      color: white;
      z-index: 10;
    }

    .header .left {
      font-size: 24px;
      color: white;
      cursor: pointer;
    }

    .header .center {
      flex: 1;
      text-align: center;
      font-weight: bold;
      color: var(--light-blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header .center img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-right: 10px;
      object-fit: cover;
    }

    .header .right {
      font-size: 24px;
      color: white;
      cursor: pointer;
    }

    .chat {
      position: absolute;
      top: 60px;
      bottom: 70px;
      left: 0;
      right: 0;
      background: var(--bg-dark);
      overflow-y: auto;
      padding: 10px;
    }

    /* Chat-Nachrichten */
    .bubble {
      max-width: 50%;
      margin: 6px 0;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      word-break: break-word;
      position: relative;
      background: rgba(79, 195, 247, 0.15);
    }

    .me {
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.8) 0%, rgba(2, 136, 209, 0.9) 100%);
      color: #000;
      margin-left: auto;
      border-bottom-right-radius: 0;
    }

    .other {
      background: rgba(30, 41, 59, 0.7);
      color: white;
      margin-right: auto;
      border-bottom-left-radius: 0;
    }

    .time {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .read-status {
      font-weight: bold;
      font-size: 12px;
    }

    /* Profilbilder */
    .profile-pic-container {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .profile-pic-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Nachrichten-Status */
    .read-status.pending {
      color: #94a3b8;
    }

    .read-status.sent {
      color: #94a3b8;
    }

    .read-status.delivered {
      color: #94a3b8;
    }

    .read-status.seen {
      color: #4FC3F7;
    }

    .read-status.error {
      color: #ff4444;
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #0d1524;
      display: flex;
      align-items: center;
      padding: 0 8px;
      border-top: 1px solid #0A3D62;
    }

    .footer input[type=text] {
      flex: 1;
      background: #1f2937;
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 15px;
    }

    .footer button,
    .footer label {
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      margin: 0 6px;
      cursor: pointer;
    }

    /* Typing Indicator */
    #typingIndicator {
      position: fixed;
      bottom: 75px;
      left: 10px;
      right: 10px;
      color: #94a3b8;
      font-size: 12px;
      display: none;
      height: 20px;
    }

    /* CSS für das Pop-up */
    .popup-menu {
      position: fixed;
      top: 60px;
      right: 15px;
      width: 220px;
      background-color: #1f2937;
      border: 1px solid #0A3D62;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 1000;
      overflow: hidden;
    }

    .popup-item {
      padding: 12px 16px;
      color: #EAEAEA;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      border-bottom: 1px solid #0A3D62;
      transition: background 0.2s;
    }

    .popup-item:last-child {
      border-bottom: none;
    }

    .popup-item:hover {
      background-color: rgba(79, 195, 247, 0.2);
    }

    .popup-item i {
      width: 20px;
      text-align: center;
      color: #4FC3F7;
    }
  </style>
</head>
<body>
  <!-- Popup Menü oben rechts -->
  <div id="popupMenu" class="popup-menu">
    <div class="popup-item" onclick="handleMenuClick('edit')">
      <i class="fa-solid fa-pen"></i> Bearbeiten
    </div>
    <div class="popup-item" onclick="handleMenuClick('info')">
      <i class="fa-solid fa-circle-info"></i> Gruppeninfo
    </div>
    <div class="popup-item" onclick="handleMenuClick('members')">
      <i class="fa-solid fa-users"></i> Mitglieder
    </div>
    <div class="popup-item" onclick="handleMenuClick('mute')">
      <i class="fa-solid fa-bell-slash"></i> Stummschalten
    </div>
    <div class="popup-item" onclick="handleMenuClick('leave')">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Verlassen
    </div>
  </div>

  <div class="header">
    <!-- Zurück-Button -->
    <div class="left" onclick="window.history.back();">
      <i class="fa-solid fa-arrow-left"></i>
    </div>
    <div class="center">
      <img src="path_to_group_photo.jpg" alt="Gruppenbild"> <!-- Gruppenbild -->
      Gruppenchat
    </div>
    <!-- Gruppen-Einstellungs-Button -->
    <div class="right" onclick="togglePopup(event)">
      <i class="fa-solid fa-users-cog"></i>
    </div>
  </div>

  <div class="chat">
    <!-- Hier keine Demo-Nachrichten mehr -->
  </div>

  <div class="footer">
    <!-- "+" Icon für das Hinzufügen von Medien/Elementen -->
    <div class="left">
      <button><i class="fa-solid fa-plus"></i></button>
    </div>
    <!-- Eingabefeld für Nachrichten -->
    <input type="text" id="msg" placeholder="Nachricht schreiben...">
    <!-- Sprachnachrichten-Icon -->
    <button><i class="fa-solid fa-microphone"></i></button>
    <!-- Foto-Icon -->
    <button><i class="fa-solid fa-camera"></i></button>
    <button><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <div id="typingIndicator">
    <span id="typingText"></span> <span style="animation: blink 0.6s infinite;">●●●</span>
  </div>

  <script>
    // Popup Menu Toggle
    function togglePopup(event) {
      event.stopPropagation();
      const popup = document.getElementById('popupMenu');
      popup.style.display = (popup.style.display === 'block') ? 'none' : 'block';
    }

    // Popup Menu schließen, wenn anderswo geklickt wird
    document.addEventListener('click', function(event) {
      const popup = document.getElementById('popupMenu');
      const headerRight = document.querySelector('.header .right');

      if (!popup.contains(event.target) && !headerRight.contains(event.target)) {
        popup.style.display = 'none';
      }
    });

    // Menu Optionen Handler
    function handleMenuClick(option) {
      console.log('Gewählte Option:', option);
      document.getElementById('popupMenu').style.display = 'none';

      switch(option) {
        case 'edit':
          alert('Gruppe bearbeiten...');
          break;
        case 'info':
          alert('Gruppeninfo anzeigen...');
          break;
        case 'members':
          alert('Mitglieder anzeigen...');
          break;
        case 'mute':
          alert('Gruppe stummgeschaltet...');
          break;
        case 'leave':
          alert('Gruppe verlassen...');
          break;
      }
    }
  </script>
</body>
</html>
